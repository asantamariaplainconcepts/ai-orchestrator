services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18.3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "aiorchestratordb"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "aio-postgres-data"
        read_only: false
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U postgres -d aiorchestratordb"
      interval: "2s"
      timeout: "5s"
      retries: 15
      start_period: "5s"
  migrations:
    image: "ghcr.io/asantamariaplainconcepts/ai-orchestrator/migrations:${AIO_IMAGE_TAG:-latest}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__aiorchestratordb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=aiorchestratordb"
      AIORCHESTRATORDB_HOST: "postgres"
      AIORCHESTRATORDB_PORT: "5432"
      AIORCHESTRATORDB_USERNAME: "postgres"
      AIORCHESTRATORDB_PASSWORD: "${POSTGRES_PASSWORD}"
      AIORCHESTRATORDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/aiorchestratordb"
      AIORCHESTRATORDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/aiorchestratordb"
      AIORCHESTRATORDB_DATABASENAME: "aiorchestratordb"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "migrations"
    depends_on:
      postgres:
        condition: "service_healthy"
    networks:
      - "aspire"
  server:
    image: "ghcr.io/asantamariaplainconcepts/ai-orchestrator/server:${AIO_IMAGE_TAG:-latest}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SERVER_PORT}"
      ConnectionStrings__aiorchestratordb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=aiorchestratordb"
      AIORCHESTRATORDB_HOST: "postgres"
      AIORCHESTRATORDB_PORT: "5432"
      AIORCHESTRATORDB_USERNAME: "postgres"
      AIORCHESTRATORDB_PASSWORD: "${POSTGRES_PASSWORD}"
      AIORCHESTRATORDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/aiorchestratordb"
      AIORCHESTRATORDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/aiorchestratordb"
      AIORCHESTRATORDB_DATABASENAME: "aiorchestratordb"
      Identity__Mode: "LocalOwner"
      Habitat__LocalFolderUnavailableReason: "the orchestrator runs in a container here, and a folder on this machine is not visible to it — local folders need the dev loop, where the server is a process on this machine"
      Dispatch__PodImage: "ghcr.io/asantamariaplainconcepts/ai-orchestrator/dispatch-worker:latest"
      Dispatch__PodNetwork: "selfhost_aspire"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "server"
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: "service_healthy"
      migrations:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  aio-postgres-data:
    driver: "local"
