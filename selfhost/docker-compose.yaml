services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18.3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "aiorchestratordb"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "aio-postgres-data"
        read_only: false
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U postgres -d aiorchestratordb"
      interval: "2s"
      timeout: "5s"
      retries: 15
      start_period: "5s"
  storage:
    image: "mcr.microsoft.com/azure-storage/azurite:latest"
    command:
      - "azurite-queue"
      - "--queueHost"
      - "0.0.0.0"
    expose:
      - "10001"
    networks:
      - "aspire"
  migrations:
    build:
      context: ".."
      dockerfile: "src/root/AiOrchestrator.MigrationService/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__aiorchestratordb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=aiorchestratordb"
      AIORCHESTRATORDB_HOST: "postgres"
      AIORCHESTRATORDB_PORT: "5432"
      AIORCHESTRATORDB_USERNAME: "postgres"
      AIORCHESTRATORDB_PASSWORD: "${POSTGRES_PASSWORD}"
      AIORCHESTRATORDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/aiorchestratordb"
      AIORCHESTRATORDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/aiorchestratordb"
      AIORCHESTRATORDB_DATABASENAME: "aiorchestratordb"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "migrations"
    depends_on:
      postgres:
        condition: "service_healthy"
    networks:
      - "aspire"
  dispatch:
    build:
      context: ".."
      dockerfile: "src/root/AiOrchestrator.DispatchWorker/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__aiorchestratordb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=aiorchestratordb"
      AIORCHESTRATORDB_HOST: "postgres"
      AIORCHESTRATORDB_PORT: "5432"
      AIORCHESTRATORDB_USERNAME: "postgres"
      AIORCHESTRATORDB_PASSWORD: "${POSTGRES_PASSWORD}"
      AIORCHESTRATORDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/aiorchestratordb"
      AIORCHESTRATORDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/aiorchestratordb"
      AIORCHESTRATORDB_DATABASENAME: "aiorchestratordb"
      ConnectionStrings__queues: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://storage:10001/devstoreaccount1;"
      Dispatch__LocalPollSeconds: "5"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "dispatch"
    depends_on:
      postgres:
        condition: "service_healthy"
      migrations:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
  server:
    build:
      context: ".."
      dockerfile: "src/root/AiOrchestrator.Server/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SERVER_PORT}"
      ConnectionStrings__aiorchestratordb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=aiorchestratordb"
      AIORCHESTRATORDB_HOST: "postgres"
      AIORCHESTRATORDB_PORT: "5432"
      AIORCHESTRATORDB_USERNAME: "postgres"
      AIORCHESTRATORDB_PASSWORD: "${POSTGRES_PASSWORD}"
      AIORCHESTRATORDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/aiorchestratordb"
      AIORCHESTRATORDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/aiorchestratordb"
      AIORCHESTRATORDB_DATABASENAME: "aiorchestratordb"
      ConnectionStrings__queues: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://storage:10001/devstoreaccount1;"
      Identity__Mode: "LocalOwner"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "server"
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: "service_healthy"
      migrations:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  aio-postgres-data:
    driver: "local"
