name: Deploy (dev)

# Applies infrastructure and deploys the portal to the dev environment.
#
# One job, and that is a security property rather than a simplification: every step that can
# reach Azure sits inside the `dev` Environment, so GitHub mints a token scoped to *that*
# environment and nothing else. A future `prod` environment gets its own credential, and a run
# holding dev's cannot touch it.
#
# Whether a run waits for a human is a property of the environment, not of this file (DEC-047).
# `dev` is disposable and runs unattended; `prod` will require a reviewer. Do not read the
# `environment:` key below as an approval gate — check the environment's settings.
#
# An earlier shape ran the plan in a separate job so the approver could read it before deciding.
# It could not authenticate — a job with no environment gets a token whose subject names the
# branch, not the environment — and the fixes were both worse than the problem. A second
# credential scoped to the branch would hand every push to main Contributor with no approval; a
# separate read-only identity would still need Key Vault read access, because Terraform refreshes
# secret resources by reading their values, and an unattended identity that can read the database
# password is exactly what BR-010 exists to prevent. What is approved here is "release this
# commit to dev", against Terraform that already passed validation in PR review.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to the commit SHA)"
        required: false
        type: string

# One deploy at a time. Two concurrent runs would race on Terraform state and on the container
# app revision, and the loser would silently win — whichever finished last.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for OIDC; nothing here uses a stored Azure password

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The approval gate. Reviewers are configured on the Environment, not here, so tightening
    # them never needs a commit.
    environment:
      name: dev
      url: ${{ steps.verify.outputs.portal_url }}
    steps:
      - uses: actions/checkout@v4

      # This repository is public, so these logs are public. GitHub redacts secret *values*
      # automatically, which covers the id where it comes from the secret — but not where
      # Terraform echoes it back inside a resource ID it read from state. Masking the value
      # explicitly covers both, and costs one step.
      - name: Mask the subscription id
        run: echo "::add-mask::${{ secrets.ARM_SUBSCRIPTION_ID }}"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Initialise
        working-directory: infra/dev
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true"

      # Planned and applied as two steps over one saved plan file, so what is applied is exactly
      # what was printed — and the printed plan is in the summary of the run that made the
      # change, which is where anyone asking "what did this deploy do" will look.
      #
      # The subscription guard (design D3) fails here if the federated credential ever points at
      # the wrong subscription, before a single resource is touched.
      - name: Plan
        working-directory: infra/dev
        env:
          TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          # Repository VARIABLES, not secrets: the ids identify the sign-in app, they do not
          # authenticate it (DEC-058). Empty when unset, which leaves sign-in off — presence is
          # the switch, in Terraform and in the Server alike.
          TF_VAR_entra_tenant_id: ${{ vars.ENTRA_TENANT_ID }}
          TF_VAR_entra_client_id: ${{ vars.ENTRA_CLIENT_ID }}
          # Who may configure anything after #13 retired "every signed-in user is Admin". Same kind
          # of value and same reason it is a variable: an object id names a person in a tenant and
          # authenticates nobody. Unset means nobody administers anything, which the portal says out
          # loud at startup rather than leaving somebody to discover it button by button.
          TF_VAR_bootstrap_admins: ${{ vars.BOOTSTRAP_ADMINS }}
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            tail -30 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        working-directory: infra/dev
        env:
          TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_entra_tenant_id: ${{ vars.ENTRA_TENANT_ID }}
          TF_VAR_entra_client_id: ${{ vars.ENTRA_CLIENT_ID }}
          TF_VAR_bootstrap_admins: ${{ vars.BOOTSTRAP_ADMINS }}
        run: terraform apply -input=false -no-color tfplan

      # deploy.sh owns the release ordering — push, migrate, wait, then move the revision. CI
      # calls it rather than restating it, so the sequence that protects a running app cannot
      # drift between the two ways of invoking it (ADR-0003).
      - name: Deploy
        env:
          TAG: ${{ inputs.tag || github.sha }}
        run: ./infra/deploy.sh

      # A green deploy step means the commands returned zero. It does not mean the site serves
      # (ADR-0004), so ask the running app.
      - name: Verify the portal answers
        id: verify
        working-directory: infra/dev
        run: |
          set -euo pipefail
          url="$(terraform output -raw portal_url)"
          echo "portal_url=${url}" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${url}/api/health" || echo 000)"
            if [ "${code}" = "200" ]; then
              echo "✓ ${url}/api/health → 200 (attempt ${attempt})"
              exit 0
            fi
            echo "  ${url}/api/health → ${code}, retrying"
            sleep 15
          done
          echo "✗ the portal never returned 200 — the revision moved but the app is not serving" >&2
          exit 1
