name: Build & Test

on:
  workflow_call:

jobs:
  build-test:
    # Docker-capable: functional tests run against a real PostgreSQL container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      # Central package management means one file decides every version, so it is the whole key.
      # setup-dotnet's own cache wants a packages.lock.json this repo does not keep; caching the
      # global package folder directly needs no lock file and no restore-time behaviour change.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      # Before the tests, not after: the SPA build output is part of what the host serves, and
      # the functional tier asserts that same-origin serving. Running the tests first passes only
      # on a machine with a stale wwwroot lying around.
      - name: Frontend build
        working-directory: src/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Restore
        run: dotnet restore src/AiOrchestrator.slnx

      - name: Build (Release, warnings are errors)
        run: dotnet build src/AiOrchestrator.slnx --configuration Release --no-restore

      # Unit + functional + ArchTests. E2E is its own lane — it boots the whole AppHost.
      - name: Test
        run: >-
          dotnet test src/AiOrchestrator.slnx --configuration Release --no-build
          --filter "Category!=E2E"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/test-results

      # Failure-only: a shared artifact-quota hit must never red an otherwise green run.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
