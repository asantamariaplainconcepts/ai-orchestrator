name: E2E

on:
  workflow_call:

jobs:
  e2e:
    # Boots the real AppHost (Postgres + Azurite + host + Vite) and drives it with Playwright.
    # Emulator mode only — the cloud-backed variant arrives with the deploy lane.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      # Same key as the build-test lane on purpose: the two lanes now run side by side (#133), and
      # a shared key means the first to finish warms the entry the other reads next time.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The browser binary, which changes only when the Playwright version does. Deliberately not
      # claimed as the whole 31s that step costs: `--with-deps` also installs system packages with
      # apt, and those live outside this path and cannot be cached here. The download half is what
      # this saves, and the step below still runs unconditionally so a runner missing those
      # packages is never left with a browser it cannot start.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props') }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      # The E2E host runs in the E2E environment, which serves the built SPA from wwwroot rather
      # than proxying the dev server — so the static build has to exist before the run.
      - name: Build frontend
        working-directory: src/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Split like the build-test lane so both read the NuGet cache the same way and a slow
      # restore is legible as a restore rather than hidden inside a build. Warnings are already
      # errors for both: TreatWarningsAsErrors lives in src/Directory.Build.props, so the two
      # lanes cannot disagree about what compiles.
      - name: Restore
        run: dotnet restore src/AiOrchestrator.slnx

      - name: Build
        run: dotnet build src/AiOrchestrator.slnx --configuration Release --no-restore

      - name: Install Playwright browsers
        run: >-
          pwsh src/tests/AiOrchestrator.EndToEndTests/bin/Release/net10.0/playwright.ps1
          install chromium --with-deps

      - name: Run E2E
        run: >-
          dotnet test src/tests/AiOrchestrator.EndToEndTests/AiOrchestrator.EndToEndTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=e2e-results.trx"
          --results-directory ${{ github.workspace }}/e2e-results

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            e2e-results/
            src/tests/AiOrchestrator.EndToEndTests/bin/Release/net10.0/playwright-traces/
          retention-days: 7
